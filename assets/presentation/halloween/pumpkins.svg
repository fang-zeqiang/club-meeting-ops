    <path d="M115 136 C 116 128 118 122 121 116 C 146 122 172 122 195 115 C 198 122 201 128 204 136 C 174 144 144 144 115 136 Z" fill="#ff9a3c"/>
    <rect x="149" y="116" width="22" height="22" rx="2" fill="none" stroke="#ffd27a" stroke-width="3.5"/>
